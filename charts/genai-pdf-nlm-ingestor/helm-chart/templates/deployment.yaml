{{- if .Values.services.genaipdf.create }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-genai-pdf-nlm-ingestor
  namespace: {{ .Values.services.genaipdf.namespace }}
  labels:
    app: genai-pdf-nlm-ingestor
    rubix-app: {{ .Chart.Name }}    
  {{- with .Values.services.genaipdf.deployment.annotations }}
  annotations: 
    {{- toYaml . | nindent 4 }}
  {{- end }}      
spec:
  replicas: {{ .Values.services.genaipdf.replicas }}
  selector:
    matchLabels:
      app: genai-pdf-nlm-ingestor
  template:
    metadata:
      labels:
        app: genai-pdf-nlm-ingestor
        rubix-app: {{ .Chart.Name }}
      annotations:
        com.palantir.rubix.pod/sls-service-info-v2: |
          {
            "ServiceName": "{{ .Release.Name }}",
            "ServiceID": "{{ .Release.Namespace }}-{{ .Release.Name }}",
            "StackName": "{{ .Release.Namespace }}",
            "StackID": "{{ .Release.Namespace }}",
            "Containers": {
              "nginx": {
                "ProductName": "{{ .Chart.Name }}",
                "ProductVersion": "{{ .Chart.AppVersion }}"
              },
              "genai-pdf-nlm-ingestor": {
                "ProductName": "{{ .Chart.Name }}",
                "ProductVersion": "{{ .Chart.AppVersion }}"
              }
            }
          }
        com.palantir.rubix.service/pod-cert: '{}'
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: com.palantir.rubix/instance-group
                    operator: In
                    values:
                      - fedstart
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: {{ .Release.Name }}
                topologyKey: topology.kubernetes.io/zone
              weight: 100
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - {{ .Release.Name }}
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }} 
      containers:
        - name: nginx
          image: "{{ .Values.services.genaipdf.deployment_nginx.image.repository }}:{{ .Values.services.genaipdf.deployment_nginx.image.tag }}"
          imagePullPolicy: {{ .Values.services.genaipdf.deployment_nginx.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.services.genaipdf.deployment_nginx.containerPort }}
              protocol: TCP
          volumeMounts:
            - name: tls-secret-volume
              mountPath: /etc/ssl/
              readOnly: true                 
          env:
            {{- range $key, $value := .Values.services.genaipdf.deployment_nginx.config.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.name }}
                  key: {{ $value.key }}
            {{- end }}
            {{- range .Values.services.genaipdf.deployment_nginx.config.env }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}
          resources:
            requests:
              memory: {{ .Values.services.genaipdf.deployment_nginx.resources.requests.memory }}
              cpu: {{ .Values.services.genaipdf.deployment_nginx.resources.requests.cpu }}
            limits:
              memory: {{ .Values.services.genaipdf.deployment_nginx.resources.limits.memory }}
              cpu: {{ .Values.services.genaipdf.deployment_nginx.resources.limits.cpu }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault           

        - name: genai-pdf-nlm-ingestor
          image: "{{ .Values.services.genaipdf.deployment.image.repository }}:{{ .Values.services.genaipdf.deployment.image.tag }}"
          imagePullPolicy: {{ .Values.services.genaipdf.deployment.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.services.genaipdf.deployment.containerPort }}
              protocol: TCP
          resources:
            limits:
              cpu: {{ .Values.services.genaipdf.deployment.resources.limits.cpu }}
              memory: {{ .Values.services.genaipdf.deployment.resources.limits.memory }}
          env: []  
          securityContext: {}
          volumeMounts: []
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tls-secret-volume
          secret:
            secretName: cert-genai-pdf-nlm-ingestor
{{- end }}
