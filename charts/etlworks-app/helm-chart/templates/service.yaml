{{- if .Values.services.etlworks.create }}
apiVersion: v1
kind: Service
metadata: 
  name: {{ .Release.Name }}
  namespace: {{ .Values.services.etlworks.namespace }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/component: server
    rubix-app: {{ .Chart.Name }}
  {{- with .Values.services.etlworks.service.annotations }}
  annotations: 
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec: 
  type: {{ .Values.services.etlworks.service.type }}
  loadBalancerClass: {{ .Values.services.etlworks.service.loadBalancerClass }}
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http-svc  
      port: {{ .Values.services.etlworks.service.port }}
      targetPort: {{ .Values.services.etlworks.deployment_nginx.containerPort }}
      protocol: TCP
{{ end }}