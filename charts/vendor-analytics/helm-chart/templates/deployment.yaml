{{- if .Values.services.analytics.create }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.services.analytics.namespace }}
  labels:
    app: analytics
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: analytics
    rubix-app: {{ .Chart.Name }}
  {{- with .Values.services.analytics.deployment.annotations }}
  annotations: 
    {{- toYaml . | nindent 4 }}
  {{- end }}    
spec:
  replicas: {{ .Values.services.analytics.deployment.replicas }}
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: analytics
        app.kubernetes.io/component: server
        rubix-app: {{ .Chart.Name }}
      annotations:
        com.palantir.rubix.pod/sls-service-info-v2: |
          {
            "ServiceName": "{{ .Release.Name }}",
            "ServiceID": "{{ .Release.Namespace }}-{{ .Release.Name }}",
            "StackName": "{{ .Release.Namespace }}",
            "StackID": "{{ .Release.Namespace }}",
            "Containers": {
              "nginx": {
                "ProductName": "{{ .Chart.Name }}",
                "ProductVersion": "{{ .Chart.AppVersion }}"
              },
              "analytics": {
                "ProductName": "{{ .Chart.Name }}",
                "ProductVersion": "{{ .Chart.AppVersion }}"
              }              
            }
          }
        com.palantir.rubix.service/pod-cert: '{}'      
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: com.palantir.rubix/instance-group
                    operator: In
                    values:
                      - fedstart
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: {{ .Release.Name }}
                topologyKey: topology.kubernetes.io/zone
              weight: 100
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - {{ .Release.Name }}
              topologyKey: kubernetes.io/hostname

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      containers:
        - name: nginx
          image: "{{ .Values.services.analytics.deployment_nginx.image.repository }}:{{ .Values.services.analytics.deployment_nginx.image.tag }}"
          imagePullPolicy: {{ .Values.services.analytics.deployment_nginx.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.services.analytics.deployment_nginx.containerPort }}
              protocol: TCP
              name: http-svc
          volumeMounts:
            - name: tls-secret-volume
              mountPath: /etc/ssl/
              readOnly: true              
          env:
            {{- range $key, $value := .Values.services.analytics.deployment_nginx.config.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.name }}
                  key: {{ $value.key }}
            {{- end }}
            {{- range .Values.services.analytics.deployment_nginx.config.env }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}
          resources:
            requests:
              memory: {{ .Values.services.analytics.deployment_nginx.resources.requests.memory }}
              cpu: {{ .Values.services.analytics.deployment_nginx.resources.requests.cpu }}
            limits:
              memory: {{ .Values.services.analytics.deployment_nginx.resources.limits.memory }}
              cpu: {{ .Values.services.analytics.deployment_nginx.resources.limits.cpu }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault 

        - name: analytics
          image: "{{ .Values.services.analytics.deployment.image.repository }}:{{ .Values.services.analytics.deployment.image.tag }}"
          imagePullPolicy: {{ .Values.services.analytics.deployment.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.services.analytics.deployment.containerPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.services.analytics.deployment.config.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.name }}
                  key: {{ $value.key }}
            {{- end }}
            {{- range .Values.services.analytics.deployment.config.env }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}
          resources:
            requests:
              memory: {{ .Values.services.analytics.deployment.resources.requests.memory }}
              cpu: {{ .Values.services.analytics.deployment.resources.requests.cpu }}
            limits:
              memory: {{ .Values.services.analytics.deployment.resources.limits.memory }}
              cpu: {{ .Values.services.analytics.deployment.resources.limits.cpu }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tls-secret-volume
          secret:
            secretName: cert-analytics 
{{ end }}