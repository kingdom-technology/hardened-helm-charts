apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-formio
spec:
  capacity:
    storage: 5Gi  # This is a placeholder; EFS provides virtually unlimited storage.
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany  # EFS supports multiple nodes accessing the volume
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-01b83e37f4b29309c  # Your EFS ID
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-formio
  namespace: duploservices-stg-3p01
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""  # Leave empty to use the default storage class (no provisioner needed)
  resources:
    requests:
      storage: 5Gi  # Placeholder; actual storage size is not limited

