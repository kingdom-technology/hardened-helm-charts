apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-sink
  namespace: authorium
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smtp-sink
  template:
    metadata:
      labels:
        app: smtp-sink
    spec:
      # run as non-root, read-only FS
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
      - name: mailpit
        # mirror this image into your ECR FIPS and use that reference here
        image: 070029289390.dkr.ecr-fips.us-gov-west-1.amazonaws.com/mailpit:v1.27.11
        args:
          # SMTP listen on 25, disable auth, bind all
          - --smtp=0.0.0.0:25
          # optional: expose a local-only UI if you want to view messages
          # - --ui=0.0.0.0:8025
          # to harden further you can require a token:
          # - --webroot=/
          # - --auth-file=/secrets/users
        ports:
        - containerPort: 25
          name: smtp
        # comment out if you don’t want the web UI
        # - containerPort: 8025
        #   name: ui
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: { cpu: "50m", memory: "64Mi" }
          limits:   { cpu: "200m", memory: "256Mi" }