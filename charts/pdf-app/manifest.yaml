---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: formio-pdf-server
  namespace: duploservices-stg-3p01  
  labels:
    app: formio-pdf-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: formio-pdf-server
  template:
    metadata:
      labels:
        app: formio-pdf-server
    spec:
      nodeSelector:
        tenantname: duploservices-stg-3p01
      containers:
        - name: formio-pdf-server
          image: 070029289390.dkr.ecr.us-gov-west-1.amazonaws.com/formio-pdf-server:5.8.0
          ports:
            - containerPort: 4005
              protocol: TCP
          env:
            - name: DEBUG
              value: "pdf.*"
            - name: FORMIO_PDF_PORT
              value: "4005"
            - name: FORMIO_S3_BUCKET
              value: "formio-staging"
            - name: FORMIO_S3_REGION
              value: "us-gov-west-1"
            - name: FORMIO_PDF_PORT
              value: "4005"                                          
            - name: ENABLE_SSL
              value: "true"
            - name: MONGO_CA
              value: "/etc/rds/us-gov-west-1-bundle.pem"
            - name: MONGO
              valueFrom:
                secretKeyRef:
                  name: formio-secrets
                  key: MONGO
            - name: LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: formio-secrets
                  key: LICENSE_KEY
            - name: SSL_KEY
              valueFrom:
                secretKeyRef:
                  name: formio-secrets
                  key: SSL_KEY
            - name: SSL_CERT
              valueFrom:
                secretKeyRef:
                  name: formio-secrets
                  key: SSL_CERT            
            - name: FORMIO_PDF_ADMINKEY
              valueFrom:
                secretKeyRef:
                  name: formio-secrets
                  key: PDF_ADMINKEY
            - name: DB_SECRET
              valueFrom:
                secretKeyRef:
                  name: formio-secrets
                  key: DB_SECRET
            - name: FORMIO_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: formio-secrets
                  key: FORMIO_S3_KEY
            - name: FORMIO_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: formio-secrets
                  key: FORMIO_S3_SECRET                                                                                    
            - name: PDF_BROWSER_TIMEOUT
              valueFrom:
                secretKeyRef:
                  name: formio-secrets
                  key: PDF_BROWSER_TIMEOUT
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            - mountPath: /etc/rds
              name: formio-ca-bundle
              readOnly: true
            # - mountPath: /efs
            #   name: formio-pdf-pv
          securityContext:
            readOnlyRootFilesystem: false
            privileged: false
      volumes:
        - name: formio-ca-bundle
          persistentVolumeClaim:
            claimName: pvc-formio
        # - name: formio-pdf-pv
        #   persistentVolumeClaim:
        #     claimName: formio-pdf-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: formio-pdf-service
  namespace: duploservices-stg-3p01
  labels:
    app: formio-pdf-server
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-subnets: subnet-00507881a9d442a00, subnet-0c4b81b03e65a4ebf
    external-dns.alpha.kubernetes.io/hostname: innovate-forms-pdf-server-stg-3p01.authorium.com
    service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "false"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-security-groups: sg-0bf3248f559608753, sg-07e88d2f9bdb09a92
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws-us-gov:acm:us-gov-west-1:070029289390:certificate/33353efb-210b-4a9b-80c4-7df5a5eca554"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: ssl
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  selector:
    app: formio-pdf-server
  ports:
    - port: 443
      targetPort: 4005
      protocol: TCP