      ##      - name: {{ $key }}
      ##        valueFrom:
      ##          secretKeyRef:
      ##            name: {{ $value.name }}
      ##            key: {{ $value.key }}
      ##      {{- end }}
      ##      {{- range .Values.services.ckecore.deployment.config.env }}
      ##      - name: {{ .name }}
      ##        value: "{{ .value }}"
      ##      {{- end }}  
      ##    securityContext:
      ##      runAsUser: 10001
      ##      runAsGroup: 10001
      ##      runAsNonRoot: true
      ##    volumeMounts:
      ##      - name: external-ca-bundle
      ##        mountPath: /usr/local/share/ca-certificates/fed-ca.pem
      ##        subPath: ca.pem
      ##        readOnly: true  
      ##      - name: tmp-home
      ##        mountPath: /tmp/home
      ##        readOnly: false          

      containers:    
        - name: nginx
          image: "{{ .Values.services.ckecore.deployment_nginx.image.repository }}:{{ .Values.services.ckecore.deployment_nginx.image.tag }}"
          imagePullPolicy: {{ .Values.services.ckecore.deployment_nginx.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.services.ckecore.deployment_nginx.containerPort }}
              protocol: TCP
              name: http-svc
          volumeMounts:
            - name: tls-secret-volume
              mountPath: /etc/ssl/
              readOnly: true                 
          env:
            {{- range $key, $value := .Values.services.ckecore.deployment_nginx.config.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.name }}
                  key: {{ $value.key }}
            {{- end }}
            {{- range .Values.services.ckecore.deployment_nginx.config.env }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}
          resources:
            requests:
              memory: {{ .Values.services.ckecore.deployment_nginx.resources.requests.memory }}
              cpu: {{ .Values.services.ckecore.deployment_nginx.resources.requests.cpu }}
            limits:
              memory: {{ .Values.services.ckecore.deployment_nginx.resources.limits.memory }}
              cpu: {{ .Values.services.ckecore.deployment_nginx.resources.limits.cpu }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault               

        - name: cke-core
          image: "{{ .Values.services.ckecore.deployment.image.repository }}:{{ .Values.services.ckecore.deployment.image.tag }}"
          imagePullPolicy: {{ .Values.services.ckecore.deployment.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.services.ckecore.deployment.containerPort }}
              protocol: TCP
          volumeMounts:
            - name: redis-ca
              mountPath: /etc/ssl/
              readOnly: true 
            - name: external-ca-bundle
              mountPath: /usr/local/share/ca-certificates/fed-ca.pem
              subPath: ca.pem
              readOnly: true          
          env:
            {{- range $key, $value := .Values.services.ckecore.deployment.config.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.name }}
                  key: {{ $value.key }}
            {{- end }}
            {{- range .Values.services.ckecore.deployment.config.env }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}          
          resources:      
            limits:
              cpu: {{ .Values.services.ckecore.deployment.resources.limits.cpu }}
              memory: {{ .Values.services.ckecore.deployment.resources.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          #livenessProbe:
          #  httpGet:
          #    path: /health
          #    port: 8080
          #  initialDelaySeconds: 20
          #  periodSeconds: 20
          #  failureThreshold: 10
          #  timeoutSeconds: 5
      restartPolicy: Always
      volumes:
        - name: tls-secret-volume
          secret:
            secretName: cert-cke-core
        - name: redis-ca
          secret:
            secretName:  cert-cke-core-redis-4
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: external-ca-bundle
          configMap:
            name: tls-external-ca-bundle
            items:
              - key: ca.pem
                path: ca.pem
        - name: tmp-home
          emptyDir: {}
{{ end }}