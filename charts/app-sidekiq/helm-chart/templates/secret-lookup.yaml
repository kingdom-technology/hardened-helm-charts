{{- $ns := .Release.Namespace -}}
{{- $s := lookup "v1" "Secret" $ns "authorium-app-redis" -}}
{{- if $s }}
{{- $pass := index $s.data "redis-password" | b64dec -}}
apiVersion: v1
kind: Secret
metadata:
  name: authorium-redis-url
  namespace: {{ $ns }}
type: Opaque
stringData:
  REDIS_URL: rediss://:{{ $pass }}@authorium-app-redis-master.authorium.svc.cluster.local:6379/0
{{- end }}
