{{- if .Values.services.appsidekiq.storage.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-pvc
  namespace: {{ .Values.services.appsidekiq.namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  accessModes:
    {{- range .Values.services.appsidekiq.storage.persistence.accessModes }}
    - {{ . }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.services.appsidekiq.storage.persistence.size}}
  storageClassName: {{ .Values.services.appsidekiq.storage.persistence.storageClassName }}
  volumeMode: {{ .Values.services.appsidekiq.storage.persistence.volume }}
{{ end }}
