{{- if .Values.services.appsidekiq.create }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.services.appsidekiq.namespace }}
  labels:
    app: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: {{ .Release.Name }}
    rubix-app: {{ .Chart.Name }}
  {{- with .Values.services.appsidekiq.deployment.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.services.appsidekiq.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/component: server
        rubix-app: {{ .Chart.Name }}
      annotations:
        com.palantir.rubix.pod/sls-service-info-v2: |
          {
            "ServiceName": "{{ .Release.Name }}",
            "ServiceID": "{{ .Release.Namespace }}-{{ .Release.Name }}",
            "StackName": "{{ .Release.Namespace }}",
            "StackID": "{{ .Release.Namespace }}",
            "Containers": {
              "nginx": {
                "ProductName": "{{ .Chart.Name }}",
                "ProductVersion": "{{ .Chart.AppVersion }}"
              },
              "appsidekiq-app": {
                "ProductName": "{{ .Chart.Name }}",
                "ProductVersion": "{{ .Chart.AppVersion }}"
              }
            }
          }
        com.palantir.rubix.service/pod-cert: '{}'
    spec:
      automountServiceAccountToken: {{ .Values.services.appsidekiq.serviceaccount.automountServiceAccountToken }}
      serviceAccountName: "{{ .Values.services.appsidekiq.serviceaccount.name }}"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: com.palantir.rubix/instance-group
                    operator: In
                    values:
                      - fedstart
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: {{ .Release.Name }}
                topologyKey: topology.kubernetes.io/zone
              weight: 100
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - {{ .Release.Name }}
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      initContainers:
        - name: ca-bundle
          image: "{{ .Values.services.appsidekiq.deployment.image.repository }}:{{ .Values.services.appsidekiq.deployment.image.tag }}"
          imagePullPolicy: {{ .Values.services.appsidekiq.deployment.image.pullPolicy | default "IfNotPresent" }}
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -euo pipefail
              SYS="/etc/ssl/certs/ca-certificates.crt"   # Ubuntu/Debian path
              OUT="/etc/ssl/custom/combined.pem"
              mkdir -p /etc/ssl/custom
              cp "$SYS" "$OUT"
              # Append Redis CA if present
              if [ -s /etc/ssl/ca.crt ]; then
                echo >> "$OUT"; cat /etc/ssl/ca.crt >> "$OUT"
              fi
              # Append your external/fed CA if present
              if [ -s /usr/local/share/ca-certificates/fed-ca.pem ]; then
                echo >> "$OUT"; cat /usr/local/share/ca-certificates/fed-ca.pem >> "$OUT"
              fi
              echo "Combined bundle ready at $OUT"
          volumeMounts:
            - name: ca-bundle
              mountPath: /etc/ssl/custom
            - name: redis-ca
              mountPath: /etc/redis/ca
              readOnly: true
            - name: external-ca-bundle
              mountPath: /usr/local/share/ca-certificates/fed-ca.pem
              subPath: ca.pem
              readOnly: true
        - name: connection
          image: ${AWS_ACCOUNT_ID}.dkr.ecr-fips.us-gov-west-1.amazonaws.com/vendor/postgresql:16
          command: ["/bin/bash","-lc"]
          args:
            - |
              set -euo pipefail
              : "${DATABASE_PORT:=5432}"
              echo "Waiting for Postgres @ ${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME} as ${DATABASE_USER} ..."
              for i in {1..60}; do
                if /opt/bitnami/postgresql/bin/psql "host=${DATABASE_HOST} port=${DATABASE_PORT} dbname=${DATABASE_NAME} user=${DATABASE_USER} password=${DATABASE_PASSWORD} sslmode=require sslrootcert=/usr/local/share/ca-certificates/fed-ca.pem" -c '\conninfo' >/dev/null 2>&1; then
                  echo "DB reachable."; exit 0
                fi
                echo "Not ready yet... ($i/60)"; sleep 5
              done
              echo "ERROR: could not reach DB in time"; exit 1
          env:
            {{- range .Values.services.appsidekiq.deployment.config.env }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}
            {{- range $key, $value := .Values.services.appsidekiq.deployment.config.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.name }}
                  key: {{ $value.key }}
            {{- end }}
          volumeMounts:
            - name: external-ca-bundle
              mountPath: /usr/local/share/ca-certificates/fed-ca.pem
              subPath: ca.pem
              readOnly: true
            - name: tmp-home
              mountPath: /tmp/home
              readOnly: false
      containers:
        - name: nginx
          image: "{{ .Values.services.appsidekiq.deployment_nginx.image.repository }}:{{ .Values.services.appsidekiq.deployment_nginx.image.tag }}"
          imagePullPolicy: {{ .Values.services.appsidekiq.deployment_nginx.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.services.appsidekiq.deployment_nginx.containerPort }}
              protocol: TCP
              name: http-svc
          volumeMounts:
            - name: tls-secret-volume
              mountPath: /etc/ssl/
              readOnly: true
            - name: redis-ca
              mountPath: /etc/ssl/
              readOnly: true
          env:
            {{- range $key, $value := .Values.services.appsidekiq.deployment_nginx.config.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.name }}
                  key: {{ $value.key }}
            {{- end }}
            {{- range .Values.services.appsidekiq.deployment_nginx.config.env }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}
          resources:
            requests:
              memory: {{ .Values.services.appsidekiq.deployment_nginx.resources.requests.memory }}
              cpu: {{ .Values.services.appsidekiq.deployment_nginx.resources.requests.cpu }}
            limits:
              memory: {{ .Values.services.appsidekiq.deployment_nginx.resources.limits.memory }}
              cpu: {{ .Values.services.appsidekiq.deployment_nginx.resources.limits.cpu }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

        - name: appsidekiq-app
          image: "{{ .Values.services.appsidekiq.deployment.image.repository }}:{{ .Values.services.appsidekiq.deployment.image.tag }}"
          imagePullPolicy: {{ .Values.services.appsidekiq.deployment.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.services.appsidekiq.deployment.containerPort }}
              protocol: TCP
          volumeMounts:
          {{- if .Values.services.appsidekiq.storage.persistence.enabled }}
            - name: data-volume
              mountPath: /db/
          {{- end }}
            - name: ca-bundle
              mountPath: /etc/ssl/custom
            - name: redis-ca
              mountPath: /etc/ssl/
              readOnly: true
            - name: external-ca-bundle
              mountPath: /usr/local/share/ca-certificates/fed-ca.pem
              subPath: ca.pem
              readOnly: true
          env:
            {{- range .Values.services.appsidekiq.deployment.config.env }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}
            {{- range $key, $value := .Values.services.appsidekiq.deployment.config.secrets }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.name }}
                  key: {{ $value.key }}
            {{- end }}
          resources:
            limits:
              cpu: {{ .Values.services.appsidekiq.deployment.resources.limits.cpu }}
              memory: {{ .Values.services.appsidekiq.deployment.resources.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "curl -k -f http://localhost:3000 || exit 1"
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3 
      volumes:
      {{- if .Values.services.appsidekiq.storage.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-pvc
      {{- end }}
        - name: tls-secret-volume
          secret:
            secretName: cert-appsidekiq-appsidekiq
        - name: redis-ca
          secret:
            secretName:  cert-appsidekiq-app-redis-4
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
        - name: external-ca-bundle
          configMap:
            name: tls-external-ca-bundle
            items:
              - key: ca.pem
                path: ca.pem
        - name: ca-bundle
          emptyDir: {}
        - name: tmp-home
          emptyDir: {}
{{ end }}