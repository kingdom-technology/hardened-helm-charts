services:

  appsidekiq:
    create: true
    migrate: false
    dbconfig: false
    initialuser: false

    namespace: <namespace>

    deployment_nginx:
      replicas: 1
      image:
        repository: "<account_id>.dkr.ecr-fips.us-gov-west-1.amazonaws.com/nginx"
        tag: "1.29.3-202511.2725-alpine"
        pullPolicy: Always
      containerPort: 8443
      resources:
        requests:
          cpu: "1"
          memory: "1Gi"
        limits:
          cpu: "1"
          memory: "1Gi"
      annotations: {}
      config:
        env:
        - name: APP_PORT
          value: "3000"
        - name: NGINX_PORT
          value: "8443"
        - name: APP_PROTOCOL
          value: "http"
        - name: SSL_CERT
          value: tls


    serviceaccount:
      name: s3-service-account
      automountServiceAccountToken: true

    storage:
      persistence:
        enabled: false
        size: 50Gi
        storageClassName: rubix-aws-provisioner-v5
        volumeMode: Filesystem
        accessModes:
          - ReadWriteOnce

    deployment:
      replicas: 2
      image:
        repository: 070029289390.dkr.ecr-fips.us-gov-west-1.amazonaws.com/appsidekiq-staging
        #tag: "1.16.0-il5"
        tag: "1.14.3"
        pullPolicy: Always
      containerPort: 3000
      resources:
        limits:
          cpu: "1024m"
          memory: "2048Mi"
      annotations: {}
      config:
        env:
          #### Integration URLs and Settings ####
        - name: CKEDITOR_API_URL
          value: ""
        - name: CKEDITOR_UPLOAD_URL
          value: ""
        - name: CKEDITOR_WEBSOCKET_URL
          value: ""
        - name: CKEDITOR_DOCX_API_VERSION
          value: "v2"
        - name: CKEDITOR_DOCX_CONVERTER_BASE_URL
          value: ""
        - name: WRITEDOCS_SITE_URL
          value: ""
        - name: ADOBE_SIGN_URL
          value: ""
        - name: DOCUSIGN_APP_LINK
          value: ""
        - name: WPROOFREADER_SERVICE_URL
          value: ""
        - name: FORMIO_BASE_URL
          value: ""
        - name: GENAI_API_HOST
          value: ""
        - name: HOST
          value: ""
        - name: FORMIO_STAGE_ID
          value: ""
        - name: SCOUT_APM_ENABLED
          value: ""
        - name: LEGISCAN_CACHE_DURATION
          value: ""
        #### AWS Settings ####
        - name: AWS_REGION
          value: "us-gov-west-1"
        - name: AWS_S3_REGION
          value: "us-gov-west-1"
        - name: AWS_EC2_METADATA_DISABLED
          value: "true"
        - name: AWS_S3_BUCKET
          value: ""
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
          value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
        - name: AWS_ROLE_ARN
          value: ""
        - name: AWS_USE_FIPS_ENDPOINT
          value: "true"
          #### Application Settings ####
        - name: RAILS_ENV
          value: "staging"
        - name: RAILS_PERFORMANCE_ENABLED
          value: "true"
        - name: RAILS_PG_EXTRAS_ENABLED
          value: "true"
        - name: ADMIN_IDLE_TIMEOUT
          value: "5"
        - name: ADMIN_PANEL_TIMEOUT
          value: "15"
        - name: SESSION_LIMIT_PER_USER
          value: "3"
        - name: USER_IDLE_TIMEOUT
          value: "10"
        - name: LOG_REQUEST
          value: "true"
          #### Database Settings ####
        - name: DATABASE_NAME
          value: ""
        - name: DATABASE_USER
          value: "postgres"
        - name: TEMP_CONGA_ORG_ID
          value: "17018"
        - name: PG_LOCKS_MONITOR_ENABLED
          value: "true"
        - name: ENABLE_PROFILER
          value: "true"
        - name: PGSSLROOTCERT
          value: /usr/local/share/ca-certificates/fed-ca.pem
        - name: PGSSLMODE
          value: "require"
        - name: SSL_CERT_FILE
          value: /etc/ssl/custom/combined.pem
        secrets:
          REDIS_PASSWORD:
            name: appsidekiq-app-redis
            key: redis-password
          REDIS_URL:
            name: appsidekiq-redis-url
            key: REDIS_URL
          appsidekiq_ADMIN_PASSWORD:
            name: appsidekiq-secrets
            key: appsidekiq_ADMIN_PASSWORD
          DATABASE_HOST:
            name: appsidekiq-secrets
            key: appsidekiq_WEB_HOST
          DATA_WAREHOUSE_DATABASE_SCHEMA:
            name: appsidekiq-secrets
            key: DATA_WAREHOUSE_DATABASE_SCHEMA
          DATA_WAREHOUSE_DATABASE_URL:
            name: appsidekiq-secrets
            key: DATA_WAREHOUSE_DATABASE_URL
          DATABASE_PASSWORD:
            name: appsidekiq-secrets
            key: appsidekiq_WEB_PASSWORD
          RAILS_MASTER_KEY:
            name: appsidekiq-secrets
            key: RAILS_MASTER_KEY 
          FORMIO_ADMIN_ROLE_ID:
            name: appsidekiq-secrets
            key: FORMIO_ADMIN_ROLE_ID 
          FORMIO_JWT_SECRET_KEY:
            name: formio-enterprise-secrets
            key: FORMIO_JWT_SECRET_KEY
          FORMIO_PROJECT_ID:
            name: appsidekiq-secrets
            key: FORMIO_PROJECT_ID
          CKEDITOR_ENV_ID:
            name: appsidekiq-secrets
            key: CKEDITOR_ENV_ID
          CKEDITOR_SECRET_KEY:
            name: appsidekiq-secrets
            key: CKEDITOR_SECRET_KEY
          CKEDITOR_API_SECRET:
            name: appsidekiq-secrets
            key: CKEDITOR_API_SECRET
          CKEDITOR_EXPORT_DOCX_SECRET_KEY:
            name: appsidekiq-secrets
            key: CKEDITOR_EXPORT_DOCX_SECRET_KEY
          DOCUSIGN_BASE_URL:
            name: appsidekiq-secrets
            key: DOCUSIGN_BASE_URL
          APRYSE_LICENSE_KEY:
            name: appsidekiq-secrets
            key: APRYSE_LICENSE_KEY
          PG_LOCKS_MONITOR_SLACK_WEBHOOK_URL:
            name: appsidekiq-secrets
            key: PG_LOCKS_MONITOR_SLACK_WEBHOOK_URL

    service:
      type: ClusterIP
      loadBalancerClass: service.k8s.aws/nlb
      port: 443
      annotations:
        com.palantir.rubix.service.spp/v3: >
          {
              "endpoints":[
              {
                "name":"http-svc",
                "prefix":"/",
                "domain-aliases":["appsidekiq-APP"]
              }
            ]
          }
        com.palantir.rubix.service/pod-cert: '{}'

  sidekiq:
    create: true

    deployment:
      replicas: 1
      image:
        repository: <account_id>.dkr.ecr-fips.us-gov-west-1.amazonaws.com/appsidekiq-staging
        tag: "1.14.3"
        pullPolicy: Always
      containerPort: 3000
      resources:
        limits:
          cpu: "1024m"
          memory: "2048Mi"
      annotations: {}
      ## Sidekiq uses the same config as appsidekiq